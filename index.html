<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="加密监控" />
  <meta name="theme-color" content="#ffffff" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:  #16a34a;
      --red:    #dc2626;
      --amber:  #d97706;
      --blue:   #2563eb;
      --purple: #7c3aed;
      --bg:     #f8fafc;
      --card:   #ffffff;
      --border: #e2e8f0;
      --text:   #0f172a;
      --muted:  #64748b;
      --radius: 12px;
    }

    body {
      font-family: -apple-system, "PingFang SC", "Hiragino Sans GB",
                   "Microsoft YaHei", BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
    }

    .container { max-width: 640px; margin: 0 auto; }

    /* ── Header ── */
    header { margin-bottom: 20px; }
    header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -.01em; }
    .header-meta { margin-top: 4px; font-size: .75rem; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
    .status-dot {
      display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      background: #94a3b8; margin-right: 4px; vertical-align: middle;
    }
    .status-dot.live  { background: var(--green); animation: pulse 2s infinite; }
    .status-dot.error { background: var(--red); }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.4} }

    /* ── Card base ── */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
    }
    .card-title {
      font-size: .65rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .06em; color: var(--muted); margin-bottom: 10px;
    }

    /* ── Tone ── */
    .tone-value { font-size: 2rem; font-weight: 700; line-height: 1; }
    .tone-label { font-size: 1rem; font-weight: 600; margin-top: 3px; }
    .tone-positive { color: var(--green); }
    .tone-negative { color: var(--red); }
    .tone-neutral  { color: var(--amber); }

    /* ── Banner ── */
    .banner {
      background: #fef3c7; border: 1px solid #fcd34d; border-radius: var(--radius);
      padding: 10px 14px; font-size: .8rem; color: #92400e;
      margin-bottom: 12px; display: none;
    }

    /* ── Section label ── */
    .section-label {
      font-size: .65rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .1em; color: var(--muted);
      margin: 20px 0 10px; display: flex; align-items: center; gap: 8px;
    }
    .section-label::after { content:""; flex:1; height:1px; background:var(--border); }

    /* ── Accordion ── */
    .accordion {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); margin-bottom: 10px; overflow: hidden;
    }
    .accordion-header {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px; cursor: pointer;
      user-select: none; -webkit-tap-highlight-color: transparent;
      transition: background .15s;
    }
    .accordion-header:hover { background: #f8fafc; }
    .accordion-header:active { background: #f1f5f9; }

    .accordion-icon { font-size: 1.1rem; flex-shrink: 0; }
    .accordion-title {
      flex: 1; font-size: .9rem; font-weight: 700; color: var(--text);
    }
    .accordion-summary {
      font-size: .72rem; color: var(--muted); margin-right: 6px;
      text-align: right; line-height: 1.3; max-width: 120px;
    }
    .accordion-arrow {
      color: var(--muted); font-size: .8rem; flex-shrink: 0;
      transition: transform .25s ease;
    }
    .accordion.open .accordion-arrow { transform: rotate(180deg); }

    .accordion-body {
      max-height: 0; overflow: hidden;
      transition: max-height .35s ease;
    }
    .accordion.open .accordion-body { max-height: 4000px; }

    .accordion-content {
      padding: 0 16px 16px; border-top: 1px solid var(--border);
    }

    /* ── Analysis blocks ── */
    .analysis-section { margin-top: 14px; }
    .analysis-heading {
      font-size: .72rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px;
    }
    .analysis-para {
      font-size: .85rem; line-height: 1.75; color: #334155; margin-bottom: 10px;
    }
    .analysis-para:last-child { margin-bottom: 0; }

    /* ── Metrics grid ── */
    .metrics-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
      margin-bottom: 12px;
    }
    .metric-box {
      background: var(--bg); border-radius: 8px; padding: 10px 12px;
    }
    .metric-label { font-size: .65rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
    .metric-value { font-size: .95rem; font-weight: 700; margin-top: 2px; }
    .metric-note  { font-size: .65rem; color: var(--muted); margin-top: 1px; }
    .metric-up   { color: var(--green); }
    .metric-down { color: var(--red); }
    .metric-flat { color: var(--amber); }

    /* ── Token mini-row ── */
    .token-mini {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; border-bottom: 1px solid var(--border);
      font-size: .82rem;
    }
    .token-mini:last-child { border-bottom: none; }
    .token-mini-left { display: flex; gap: 8px; align-items: baseline; }
    .token-mini-sym { font-weight: 700; }
    .token-mini-name { font-size: .72rem; color: var(--muted); }
    .token-mini-right { display: flex; gap: 12px; align-items: center; }
    .token-mini-price { font-weight: 600; }
    .token-mini-pct   { font-weight: 700; font-size: .8rem; min-width: 56px; text-align: right; }
    .token-mini-range {
      width: 50px; height: 3px; background: #e2e8f0; border-radius: 99px;
      position: relative; flex-shrink: 0;
    }
    .token-mini-marker {
      position: absolute; top: -3px; width: 9px; height: 9px;
      background: #475569; border-radius: 50%; transform: translateX(-50%);
    }

    /* ── News inside accordion ── */
    .news-list-inner { margin-top: 4px; }
    .news-item-inner {
      padding: 8px 0; border-bottom: 1px solid var(--border);
    }
    .news-item-inner:last-child { border-bottom: none; }
    .news-title-inner {
      font-size: .82rem; font-weight: 600; line-height: 1.4;
      color: var(--text); text-decoration: none; display: block;
    }
    .news-title-inner:hover { color: var(--blue); }
    .news-meta-inner { font-size: .65rem; color: var(--muted); margin-top: 2px; }
    .news-empty-inner { font-size: .78rem; color: var(--muted); padding: 10px 0; }

    /* ── Highlight box ── */
    .highlight-box {
      background: #eff6ff; border-left: 3px solid var(--blue);
      border-radius: 0 6px 6px 0; padding: 10px 12px; margin: 10px 0;
      font-size: .82rem; line-height: 1.7; color: #1e40af;
    }
    .highlight-box.amber {
      background: #fffbeb; border-color: var(--amber); color: #92400e;
    }
    .highlight-box.green {
      background: #f0fdf4; border-color: var(--green); color: #166534;
    }
    .highlight-box.red {
      background: #fef2f2; border-color: var(--red); color: #991b1b;
    }

    /* ── Divider ── */
    .mini-divider { height: 1px; background: var(--border); margin: 12px 0; }

    /* ── Price cards ── */
    .group-label {
      font-size: .65rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .1em; color: var(--muted); margin: 16px 0 8px;
    }
    .token-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 16px; margin-bottom: 8px;
    }
    .token-row { display: flex; align-items: center; justify-content: space-between; }
    .token-symbol { font-size: .95rem; font-weight: 700; }
    .token-name   { font-size: .72rem; color: var(--muted); margin-top: 1px; }
    .token-price  { font-size: .95rem; font-weight: 600; text-align: right; }
    .token-change { font-size: .8rem; font-weight: 600; text-align: right; margin-top: 1px; }
    .up   { color: var(--green); }
    .dn   { color: var(--red); }
    .flat { color: var(--muted); }
    .range-bar-wrap { margin-top: 10px; }
    .range-labels {
      display: flex; justify-content: space-between;
      font-size: .65rem; color: var(--muted); margin-bottom: 4px;
    }
    .range-track { height: 4px; background: #e2e8f0; border-radius: 9999px; position: relative; }
    .range-marker {
      position: absolute; top: -3px; width: 10px; height: 10px;
      background: #334155; border-radius: 50%; transform: translateX(-50%);
      transition: left .4s ease;
    }

    /* ── Skeleton ── */
    .skeleton {
      background: linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%);
      background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 6px;
    }
    @keyframes shimmer { 0%{background-position:200% 0}100%{background-position:-200% 0} }

    /* ── Refresh button ── */
    .refresh-btn {
      display: block; width: 100%; margin-top: 8px; padding: 12px;
      border-radius: var(--radius); border: 1px solid var(--border);
      background: var(--card); font-size: .875rem; font-weight: 600;
      color: var(--text); cursor: pointer; transition: background .15s;
    }
    .refresh-btn:hover    { background: #f1f5f9; }
    .refresh-btn:active   { background: #e2e8f0; }
    .refresh-btn:disabled { color: var(--muted); cursor: not-allowed; }

    /* ── Footer ── */
    footer {
      margin-top: 24px; padding: 16px 0 8px;
      border-top: 1px solid var(--border);
      font-size: .72rem; color: var(--muted); line-height: 1.8;
    }
    footer .disclaimer { margin-bottom: 10px; font-style: italic; }
    footer .links { display: flex; flex-wrap: wrap; gap: 8px 16px; }
    footer a { color: var(--blue); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>Crypto</h1>
    <div class="header-meta">
      <span><span class="status-dot" id="liveDot"></span><span id="liveTs">正在加载…</span></span>
      <span id="snapshotLine" style="display:none"></span>
    </div>
  </header>

  <div class="banner" id="errorBanner"></div>

  <!-- Market Tone -->
  <div class="card" id="toneCard">
    <div class="card-title">市场情绪 — 四大主力</div>
    <div class="skeleton" style="height:2rem;width:80px;margin-bottom:6px"></div>
    <div class="skeleton" style="height:1rem;width:140px"></div>
  </div>

  <!-- Analysis Accordions -->
  <div class="section-label">深度分析</div>
  <div id="accordionContainer">
    <!-- rendered by JS -->
    <div class="accordion"><div class="accordion-header"><div class="skeleton" style="height:1rem;width:60%;flex:1"></div></div></div>
    <div class="accordion"><div class="accordion-header"><div class="skeleton" style="height:1rem;width:50%;flex:1"></div></div></div>
    <div class="accordion"><div class="accordion-header"><div class="skeleton" style="height:1rem;width:55%;flex:1"></div></div></div>
    <div class="accordion"><div class="accordion-header"><div class="skeleton" style="height:1rem;width:50%;flex:1"></div></div></div>
    <div class="accordion"><div class="accordion-header"><div class="skeleton" style="height:1rem;width:45%;flex:1"></div></div></div>
  </div>

  <!-- Price section -->
  <div class="section-label">实时价格行情</div>
  <div id="tokenGroups"></div>

  <button class="refresh-btn" id="refreshBtn" onclick="doRefresh()">↻ 刷新数据</button>

  <footer>
    <div class="disclaimer">仅供参考，不构成投资建议。交易前请在您的交易所核实价格。</div>
    <div class="links">
      <a href="https://www.coingecko.com" target="_blank" rel="noopener">CoinGecko</a>
      <a href="https://alternative.me/crypto/fear-and-greed-index/" target="_blank" rel="noopener">恐慌贪婪指数</a>
      <a href="https://defillama.com" target="_blank" rel="noopener">DeFiLlama TVL</a>
      <a href="https://farside.co.uk/bitcoin-etf-flow-all-data/" target="_blank" rel="noopener">BTC ETF 资金流向</a>
      <a href="https://www.binance.com/en/new-cryptocurrency-listing" target="_blank" rel="noopener">币安新币上线</a>
      <a href="https://www.bitget.com/en/new-crypto" target="_blank" rel="noopener">Bitget 新币</a>
      <a href="https://www.okx.com/markets/new-listings" target="_blank" rel="noopener">OKX 新币</a>
      <a href="https://www.coindesk.com" target="_blank" rel="noopener">CoinDesk</a>
      <a href="https://decrypt.co" target="_blank" rel="noopener">Decrypt</a>
    </div>
  </footer>

</div>
<script>
// ─── Watchlist ────────────────────────────────────────────────────────────────
const GROUPS = [
  {
    label: "主力币种",
    tokens: [
      { symbol:"BTC",     name:"比特币",       id:"bitcoin" },
      { symbol:"ETH",     name:"以太坊",        id:"ethereum" },
      { symbol:"BNB",     name:"BNB",           id:"binancecoin" },
      { symbol:"SOL",     name:"Solana",        id:"solana" },
    ]
  },
  {
    label: "AI 代理赛道",
    tokens: [
      { symbol:"TAO",     name:"Bittensor",     id:"bittensor" },
      { symbol:"FET",     name:"Fetch.ai",      id:"fetch-ai" },
      { symbol:"NEAR",    name:"NEAR Protocol", id:"near" },
      { symbol:"RENDER",  name:"Render",        id:"render-token" },
      { symbol:"VIRTUAL", name:"Virtuals",      id:"virtual-protocol" },
      // TODO: 待 0x402/PING 在 CoinGecko 上线后在此添加，格式参考上方
    ]
  },
  {
    label: "DeFi 蓝筹",
    tokens: [
      { symbol:"UNI",  name:"Uniswap",   id:"uniswap" },
      { symbol:"AAVE", name:"Aave",      id:"aave" },
      { symbol:"CRV",  name:"Curve DAO", id:"curve-dao-token" },
    ]
  }
];

const ALL_IDS = GROUPS.flatMap(g => g.tokens.map(t => t.id));
const GC_URL  = `https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd`
              + `&ids=${ALL_IDS.join(",")}&price_change_percentage=24h&sparkline=false`;
const NEWS_URL = "https://min-api.cryptocompare.com/data/v2/news/?lang=EN&sortOrder=latest";

// ─── News classification ──────────────────────────────────────────────────────
const TAGS = {
  x402:  ["0x402","x402","http 402","402 payment","payment protocol","micropayment","pay-per-call","coinbase pay","x402"],
  ai:    ["ai agent","artificial intelligence","bittensor","fetch.ai","fetch ai","near protocol","render network","virtual protocol","virtuals","autonomous agent","large language model","llm","machine learning","generative ai"],
  defi:  ["defi","decentralized finance","uniswap","aave","curve","compound","liquidity","yield farming","tvl","total value locked","dex","amm","lending protocol","staking","liquid staking","lido","eigenlayer","restaking","velodrome","balancer"],
  macro: ["federal reserve","fed rate","interest rate","inflation","cpi","sec ","cftc","regulation","regulatory","congress","senate","bitcoin etf","etf approval","tariff","gdp","recession","treasury","boj","ecb","monetary policy","enforcement action","lawsuit","ban","legal tender","cbdc","basel","mica","fatf"],
};
function classify(item) {
  const t = ((item.title||"")+" "+(item.body||"")+" "+(item.tags||"")).toLowerCase();
  if (TAGS.x402.some(k=>t.includes(k)))  return "x402";
  if (TAGS.ai.some(k=>t.includes(k)))    return "ai";
  if (TAGS.defi.some(k=>t.includes(k)))  return "defi";
  if (TAGS.macro.some(k=>t.includes(k))) return "macro";
  return "general";
}

// ─── State ────────────────────────────────────────────────────────────────────
let lastDm   = null;
let allNews  = [];
let retryTmr = null;

// ─── Helpers ──────────────────────────────────────────────────────────────────
const esc    = s => String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const fmt    = (n,d=2) => n==null?"—":n.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtUSD = n => {
  if (n==null) return "—";
  if (n>=1000) return "$"+fmt(n,0);
  if (n>=1)    return "$"+fmt(n,2);
  return "$"+n.toPrecision(4);
};
const pctCls   = v => v>.05?"up":v<-.05?"dn":"flat";
const pctArrow = v => v>.05?"▲":v<-.05?"▼":"–";
const clamp    = (v,lo,hi) => Math.max(lo,Math.min(hi,v));
const rp       = (p,lo,hi) => hi<=lo?50:clamp(((p-lo)/(hi-lo))*100,2,98);
const timeAgo  = ts => {
  const s = Math.floor(Date.now()/1000 - ts);
  if (s<60)   return "刚刚";
  if (s<3600) return Math.floor(s/60)+"分钟前";
  if (s<86400)return Math.floor(s/3600)+"小时前";
  return Math.floor(s/86400)+"天前";
};

// Chinese-specific helpers
function zhPct(v) {
  if (v==null) return "暂无";
  const sign = v>=0?"+":"";
  return `${sign}${v.toFixed(2)}%`;
}
function pctCls2(v) { return v>0?"metric-up":v<0?"metric-down":"metric-flat"; }

function groupAvg(group, dm) {
  const vals = group.tokens
    .map(t => dm[t.id]?.price_change_percentage_24h ?? null)
    .filter(v=>v!==null);
  return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}

function rangeWord(pct) {
  if (pct>=85) return "接近日高，动能强劲";
  if (pct>=65) return "偏强区间，趋势延续";
  if (pct>=45) return "中性区间，方向待明确";
  if (pct>=25) return "偏弱区间，做多谨慎";
  return "接近日低，关注企稳";
}

function sentimentWord(avg) {
  if (avg==null)  return "数据不足";
  if (avg>3)      return "强势多头";
  if (avg>1)      return "温和偏多";
  if (avg>-1)     return "多空平衡";
  if (avg>-3)     return "温和偏空";
  return "显著下跌";
}

function vsMarket(sectorAvg, majorAvg) {
  if (majorAvg==null||sectorAvg==null) return "无法对比";
  const diff = sectorAvg - majorAvg;
  if (diff>2)  return "显著强于大盘";
  if (diff>.5) return "小幅跑赢大盘";
  if (diff>-.5)return "基本与大盘同步";
  if (diff>-2) return "小幅落后大盘";
  return "显著弱于大盘";
}

// ─── News HTML builder ────────────────────────────────────────────────────────
function buildNewsHtml(tag, maxItems=5) {
  const items = allNews.filter(n=>n._tag===tag).slice(0,maxItems);
  if (!items.length) return `<div class="news-empty-inner">暂无相关新闻，新闻加载后将自动更新。</div>`;
  return `<div class="news-list-inner">${items.map(item=>`
    <div class="news-item-inner">
      <a class="news-title-inner" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">${esc(item.title)}</a>
      <div class="news-meta-inner">${esc(item.source||"")} · ${timeAgo(item.published_on)}</div>
    </div>`).join("")}</div>`;
}

function buildMacroNewsHtml(maxItems=6) {
  const items = allNews.filter(n=>n._tag==="macro").slice(0,maxItems);
  if (!items.length) return `<div class="news-empty-inner">暂无宏观新闻，新闻加载后将自动更新。</div>`;
  return `<div class="news-list-inner">${items.map(item=>`
    <div class="news-item-inner">
      <a class="news-title-inner" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">${esc(item.title)}</a>
      <div class="news-meta-inner">${esc(item.source||"")} · ${timeAgo(item.published_on)}</div>
    </div>`).join("")}</div>`;
}

// ─── Analysis generators ──────────────────────────────────────────────────────

function genMarketTrends(dm) {
  const majAvg   = groupAvg(GROUPS[0], dm);
  const aiAvg    = groupAvg(GROUPS[1], dm);
  const defiAvg  = groupAvg(GROUPS[2], dm);

  const allEntries = ALL_IDS.map(id=>dm[id]).filter(Boolean);
  const sorted = [...allEntries].sort((a,b)=>
    (b.price_change_percentage_24h??0)-(a.price_change_percentage_24h??0));
  const topToken  = sorted[0];
  const botToken  = sorted[sorted.length-1];

  const nearHigh = allEntries.filter(t=>rp(t.current_price,t.low_24h,t.high_24h)>=75).length;
  const nearLow  = allEntries.filter(t=>rp(t.current_price,t.low_24h,t.high_24h)<=25).length;

  // Determine leading sector
  const sectorRanking = [
    { name:"AI代理",     avg:aiAvg },
    { name:"DeFi蓝筹",   avg:defiAvg },
    { name:"主力币种",   avg:majAvg },
  ].filter(s=>s.avg!=null).sort((a,b)=>b.avg-a.avg);
  const leadSector = sectorRanking[0]?.name ?? "—";
  const lagSector  = sectorRanking[sectorRanking.length-1]?.name ?? "—";

  // Momentum assessment
  let momentumText;
  if (nearHigh >= 7)       momentumText = "多数标的处于日内高位区间，多头动能充沛，但需防范短线过热。";
  else if (nearHigh >= 4)  momentumText = "逾半数标的偏强，市场做多意愿较强，趋势尚未明显疲软。";
  else if (nearLow >= 4)   momentumText = "多个标的跌近日低，空头压力较重，需关注是否出现企稳信号。";
  else                     momentumText = "各标的分布较为分散，市场分歧较大，方向选择仍需观察。";

  // Overall tone sentence
  let toneSentence;
  if (majAvg==null) {
    toneSentence = "数据暂时不可用，请刷新后重试。";
  } else if (majAvg>2) {
    toneSentence = `四大主力24小时均涨 ${zhPct(majAvg)}，市场整体处于明显的风险偏好（Risk-on）状态，做多情绪主导。`;

    toneSentence = `四大主力24小时均涨 ${zhPct(majAvg)}，市场情绪温和偏多，但上涨力度有限，谨慎乐观。`;
  } else if (majAvg>-0.5) {
    toneSentence = `四大主力24小时均变动 ${zhPct(majAvg)}，市场多空力量基本平衡，方向性不明朗，建议观望为主。`;
  } else if (majAvg>-2) {
    toneSentence = `四大主力24小时均跌 ${zhPct(majAvg)}，市场情绪温和偏空，短线存在一定压力。`;
  } else {
    toneSentence = `四大主力24小时均跌 ${zhPct(majAvg)}，市场处于明显的风险规避（Risk-off）状态，建议控制仓位。`;
  }

  // Sector rotation text
  let rotationText;
  if (sectorRanking.length>=2) {
    const top = sectorRanking[0];
    const bot = sectorRanking[sectorRanking.length-1];
    if (Math.abs((top.avg??0)-(bot.avg??0))>2) {
      rotationText = `板块分化明显：${top.name}（${zhPct(top.avg)}）大幅领先${bot.name}（${zhPct(bot.avg)}），资金存在明显的板块轮动特征，市场偏好并非均匀分布。`;

    }
  } else {
    rotationText = "板块数据加载中。";

  const summary = majAvg!=null ? `${sentimentWord(majAvg)} · ${leadSector}领跑` : "加载中…";

  const html = `
    <div class="analysis-section">
      <div class="analysis-heading">整体市场情绪</div>

          <div class="metric-note">${zhPct(sectorRanking[sectorRanking.length-1]?.avg)}</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">处于日内高位</div>
          <div class="metric-value">${nearHigh} / ${allEntries.length}</div>
          <div class="metric-note">价格在区间75%以上</div>

      <div class="analysis-para">${toneSentence}</div>

    <div class="mini-divider"></div>

    <div class="analysis-section">
      <div class="analysis-heading">板块轮动分析</div>
      <div class="analysis-para">${rotationText}</div>
      <div class="metrics-grid">
        ${sectorRanking.map(s=>`
          <div class="metric-box">

      <div class="analysis-para">价格在24小时区间中的位置是短期动能的直观体现——处于高位说明买方主导，处于低位则需关注是否企稳。</div>
      <div>${GROUPS[0].tokens.map(t=>{
        const d = dm[t.id];
        if (!d) return "";
        const p = rp(d.current_price,d.low_24h,d.high_24h);
        const pct = d.price_change_percentage_24h;
        return `<div class="token-mini">
          <div class="token-mini-left">
            <span class="token-mini-sym">${t.symbol}</span>
            <span class="token-mini-name">${rangeWord(p)}</span>

          <div class="token-mini-right">

            <div class="token-mini-range"><div class="token-mini-marker" style="left:${p}%"></div></div>
          </div>
        </div>`;
      }).join("")}</div>
    </div>

    <div class="mini-divider"></div>

    <div class="analysis-section">
      <div class="analysis-heading">综合判断</div>
      <div class="${majAvg!=null&&majAvg>0?"highlight-box green":majAvg!=null&&majAvg<-1?"highlight-box red":"highlight-box amber"}">
        ${momentumText}${topToken&&botToken?` 今日全仓涨幅最大为 <strong>${topToken.symbol?.toUpperCase()}</strong>（${zhPct(topToken.price_change_percentage_24h)}），跌幅最大为 <strong>${botToken.symbol?.toUpperCase()}</strong>（${zhPct(botToken.price_change_percentage_24h)}）。`:""}
      </div>
    </div>`;

  return { summary, html };
}

        <strong>VIRTUAL（Virtuals Protocol）</strong>主攻链上AI代理的货币化，代理可持有资产并执行交易，是最接近"AI代理经济"愿景的项目之一。
      </div>
      <div class="analysis-para">
        注意：AI代理赛道高度依赖叙事和预期，基本面验证周期较长，价格波动性普遍大于主力币种，仓位管理需更为谨慎。
      </div>
    </div>

    <div class="mini-divider"></div>

    <div class="analysis-section">
      <div class="analysis-heading">AI代理赛道相关新闻</div>
      <div id="newsInAI">${buildNewsHtml("ai")}</div>
    </div>`;

  return { summary, html };
}

// ─── Accordion renderer ───────────────────────────────────────────────────────
function renderAccordions(dm) {

    { id:"trends", icon:"📊", title:"市场趋势总览",     ...genMarketTrends(dm) },
    { id:"macro",  icon:"🌐", title:"宏观经济与政策动态", ...genMacroAnalysis() },
    { id:"defi",   icon:"🔄", title:"DeFi 赛道深度分析",  ...genDeFiAnalysis(dm) },
    { id:"ai",     icon:"🤖", title:"AI 代理赛道分析",    ...genAIAnalysis(dm) },
    { id:"x402",   icon:"⚡", title:"0x402 支付协议动态", ...genX402Analysis() },
  ];

  const container = document.getElementById("accordionContainer");
  container.innerHTML = sections.map(s => `
    <div class="accordion" id="acc-${s.id}">
      <div class="accordion-header" onclick="toggleAccordion('${s.id}')">
        <span class="accordion-icon">${s.icon}</span>
        <span class="accordion-title">${s.title}</span>
        <span class="accordion-summary" id="sum-${s.id}">${s.summary}</span>
        <span class="accordion-arrow">▼</span>
      </div>
      <div class="accordion-body">
        <div class="accordion-content" id="body-${s.id}">${s.html}</div>
      </div>

}

function toggleAccordion(id) {
  const el = document.getElementById("acc-"+id);
  el.classList.toggle("open");
}

// ─── News refresh (updates sections in-place) ─────────────────────────────────
function refreshNewsInSections() {
  const m  = document.getElementById("newsInMacro");
  const d  = document.getElementById("newsInDefi");
  const a  = document.getElementById("newsInAI");
  const x  = document.getElementById("newsInX402");
  if (m) m.innerHTML  = buildMacroNewsHtml();
  if (d) d.innerHTML  = buildNewsHtml("defi");
  if (a) a.innerHTML  = buildNewsHtml("ai");
  if (x) x.innerHTML  = buildNewsHtml("x402");

  // Refresh summaries for macro accordion
  const macroSum = document.getElementById("sum-macro");
  if (macroSum) {
    const n = allNews.filter(n=>n._tag==="macro").length;
    if (n>0) macroSum.textContent = `${n}条宏观/监管动态`;
  }
  const x402Sum = document.getElementById("sum-x402");
  if (x402Sum) {
    const n = allNews.filter(n=>n._tag==="x402").length;
    if (n>0) x402Sum.textContent = `${n}条相关动态`;
  }
}

// ─── Tone card ────────────────────────────────────────────────────────────────
function computeTone(dm) {
  const vals = GROUPS[0].tokens
    .map(t=>dm[t.id]?.price_change_percentage_24h??null).filter(v=>v!==null);
  if (!vals.length) return { avg:0, label:"未知", cls:"tone-neutral" };
  const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
  return {
    avg,
    label: avg>1?"风险偏好 (Risk-on)":avg<-1?"风险规避 (Risk-off)":"混合信号 (Mixed)",
    cls:   avg>1?"tone-positive":avg<-1?"tone-negative":"tone-neutral",
  };
}

function renderTone(dm) {
  const tone = computeTone(dm);
  document.getElementById("toneCard").innerHTML = `
    <div class="card-title">市场情绪 — 四大主力24H均值</div>
    <div class="tone-value ${tone.cls}">${tone.avg>=0?"+":""}${fmt(tone.avg)}%</div>
    <div class="tone-label ${tone.cls}">${tone.label}</div>`;
}

// ─── Price groups ─────────────────────────────────────────────────────────────
function renderPrices(dm) {
  const container = document.getElementById("tokenGroups");
  container.innerHTML = "";
  for (const group of GROUPS) {
    const lbl = document.createElement("div");
    lbl.className = "group-label";
    lbl.textContent = group.label;
    container.appendChild(lbl);
    const sorted = [...group.tokens].sort((a,b)=>
      (dm[b.id]?.price_change_percentage_24h??-Infinity)-
      (dm[a.id]?.price_change_percentage_24h??-Infinity));
    for (const token of sorted) {
      const d   = dm[token.id];
      const pct = d?.price_change_percentage_24h??null;
      const cls = pct!=null?pctCls(pct):"flat";
      const arr = pct!=null?pctArrow(pct):"–";
      const p   = d?rp(d.current_price,d.low_24h,d.high_24h):50;
      const card = document.createElement("div");
      card.className="token-card";
      card.innerHTML=`
        <div class="token-row">
          <div><div class="token-symbol">${token.symbol}</div><div class="token-name">${token.name}</div></div>
          <div>
            <div class="token-price">${d?fmtUSD(d.current_price):"—"}</div>
            <div class="token-change ${cls}">${arr} ${pct!=null?Math.abs(pct).toFixed(2)+"%":"—"}</div>
          </div>
        </div>
        ${d?`<div class="range-bar-wrap">
          <div class="range-labels"><span>${fmtUSD(d.low_24h)}</span><span>24小时区间</span><span>${fmtUSD(d.high_24h)}</span></div>
          <div class="range-track"><div class="range-marker" style="left:${p}%"></div></div>
        </div>`:""}`;
      container.appendChild(card);
    }
  }
}

// ─── Status helpers ───────────────────────────────────────────────────────────
function setLive()  { document.getElementById("liveDot").className="status-dot live";  document.getElementById("liveTs").textContent="实时 · 更新于 "+new Date().toLocaleTimeString("zh-CN"); }
function setError() { document.getElementById("liveDot").className="status-dot error"; document.getElementById("liveTs").textContent="已切换至缓存数据"; }
function showBanner(m){ const b=document.getElementById("errorBanner"); b.textContent=m; b.style.display=""; }
function hideBanner() { document.getElementById("errorBanner").style.display="none"; }

// ─── Snapshot fallback ────────────────────────────────────────────────────────
async function loadSnapshot() {
  try { const r=await fetch("snapshot.json",{cache:"no-store"}); return r.ok?await r.json():null; } catch { return null; }
}
function showSnapshotMeta(s) {
  if (!s?.local_time) return;
  const el=document.getElementById("snapshotLine");
  el.textContent="快照时间："+s.local_time;
  el.style.display="";
}

// ─── News fetch ───────────────────────────────────────────────────────────────
async function fetchNews() {
  try {
    const res  = await fetch(NEWS_URL,{cache:"no-store"});
    if (!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();
    if (!data.Data) throw new Error("unexpected shape");
    allNews = data.Data.map(item=>({...item, _tag:classify(item)}));
    refreshNewsInSections();
  } catch(err) {
    console.warn("新闻加载失败:",err);
    // Try snapshot news fallback
    try {
      const snap=await fetch("snapshot.json",{cache:"no-store"}).then(r=>r.json());
      if (snap?.news?.length) {
        allNews=snap.news.map(item=>({...item,_tag:classify(item)}));
        refreshNewsInSections();
      }
    } catch {}
  }
}

// ─── Main refresh ─────────────────────────────────────────────────────────────
async function doRefresh() {
  const btn = document.getElementById("refreshBtn");
  btn.disabled=true; btn.textContent="↻ 正在刷新…";
  clearTimeout(retryTmr); hideBanner();

  try {
    const res  = await fetch(GC_URL,{cache:"no-store"});
    if (!res.ok) throw new Error("HTTP "+res.status);
    const list = await res.json();
    const dm = {};
    for (const c of list) dm[c.id]=c;
    lastDm = dm;
    renderTone(dm);
    renderAccordions(dm);
    renderPrices(dm);
    setLive();
  } catch(err) {
    console.warn("价格加载失败:",err);
    if (lastDm) {
      renderTone(lastDm); renderAccordions(lastDm); renderPrices(lastDm);
      setError(); showBanner("实时数据暂时不可用，显示上次成功加载的数据。60秒后自动重试。");
    } else {
      const snap = await loadSnapshot();
      if (snap?.tokens?.length) {
        const dm={}; for (const t of snap.tokens) dm[t.id]=t;
        renderTone(dm); renderAccordions(dm); renderPrices(dm);
        setError(); showBanner("CoinGecko暂时无法访问，显示早间7点快照数据。60秒后自动重试。");
      } else {
        setError(); showBanner("数据暂时不可用，请检查网络连接后刷新。");
      }
    }
    retryTmr = setTimeout(doRefresh, 60_000);
  } finally {
    btn.disabled=false; btn.textContent="↻ 刷新数据";
  }

  fetchNews(); // always try news refresh
}

// ─── Init ─────────────────────────────────────────────────────────────────────
(async () => {
  const snap = await loadSnapshot();
  showSnapshotMeta(snap);
  await doRefresh();
})();
</script>
